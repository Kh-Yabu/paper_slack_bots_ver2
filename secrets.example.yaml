# Copy to secrets.yaml and fill in your credentials.
# secrets.yaml is listed in .gitignore — never commit it.

# Required: OpenAI API key for abstract summarization
openai_api_key: "<your-openai-api-key>"
openai_model: "gpt-4o-mini"

# Optional: override model for LLM prefilter when provider is openai
# openai_prefilter_model: "gpt-4o-mini"

# Slack bot token(s)
# Single workspace:
slack_api_token: "xoxb-..."

# Multiple workspaces (overrides slack_api_token when set):
# slack_api_tokens:
#   default: "xoxb-..."
#   other_workspace: "xoxb-..."

# LLM prefilter defaults (can be overridden per journal in config.yaml)
classifier_provider: "github"       # github | openai
classifier_model: "openai/gpt-4.1-nano"

# Required when using GitHub Models for prefilter (provider: github)
github_token: "<your-github-token>"

# Required when using source_type: springer_api
# springer_api_key: "<your-springer-nature-api-key>"
