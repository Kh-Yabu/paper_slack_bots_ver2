# Copy this file to secrets.yaml and replace the placeholders.
# secrets.yaml is ignored by Git. Never commit real API keys or tokens.

# Required for paper summaries and the default relevance filter.
openai_api_key: "<your-openai-api-key>"
openai_summary_model: "gpt-5.6-luna"
openai_summary_reasoning_effort: "low"
openai_prefilter_model: "gpt-5.6-luna"

# Required for the workspace named "default" in config.yaml.
slack_api_tokens:
  default: "xoxb-your-slack-bot-token"

# Optional: use GitHub Models for journal relevance filtering.
# classifier_provider: "github"
# classifier_model: "openai/gpt-4.1-nano"
# github_token: "<your-github-token>"

# Optional: required only by source_type: springer_api.
# springer_api_key: "<your-springer-nature-api-key>"
