# Paper Slack Bot starter configuration
#
# Replace the example channel ID, categories, keywords, and feed URLs before use.
# Detailed examples are in docs/configuration.md and docs/adding-sources.md.

# Look for papers published during this many hours before each run.
hours_back: 48

# Keep duplicate-prevention records for this many hours.
keep_hours: 2000

# Timezone used for date comparisons and saved state.
timezone: Asia/Tokyo

# The summary language and optional field-specific guidance.
summarization:
  language: Japanese
  instructions: >
    Write for researchers in this group's field. Prefer established technical
    terms and keep numerical results when they are important.

workspaces:
  - name: default

    # arXiv is the simplest source to start with. Remove this section if unused.
    arxiv:
      slack_channel_id: C01234567
      categories:
        - cs.AI
      # An empty list posts every new paper in the selected categories.
      keywords:
        - machine learning
        - neural network

    # EarthArXiv is optional. Uncomment and edit this block when needed.
    # eartharxiv:
    #   slack_channel_id: C01234567
    #   keywords:
    #     - earthquake
    #     - geodesy

    # Add journal RSS/API sources here. Leaving the list empty is valid.
    journals: []

    # Standard RSS example:
    # journals:
    #   - title: Example Journal
    #     rss_url: https://journal.example.org/rss/latest.xml
    #     slack_channel_id: C01234567
