# Example: solid Earth geophysics (seismology, geodesy, volcanology)
#
# This is a production-scale reference configuration with 40+ journal feeds.
# Slack channel IDs are placeholders — replace C01234567 / C01234568 with your own.
# Copy sections you need into config.yaml, or use this file directly:
#   cp examples/config.solid-earth.yaml config.yaml

hours_back: 72
keep_hours: 1000

# 各ワークスペースごとの設定
workspaces:
  - name: default  # テンプレート用のワークスペース名
    arxiv:
      slack_channel_id: C01234567  # Slack チャンネルID
      categories:
        - physics.geo-ph  # 例: astro-ph.EP
      keywords:
        - seism
        - earthquake
        - seismic
        - geodesy
        - volcan # フィルタリング用キーワード
    eartharxiv:
      slack_channel_id: C01234567
      keywords:
        - seismic
        - earthquake
        - volcan
        - distributed acoustic sensing
        - ambient noise
        - tomography
        - geodesy

    journals:
      - title: EGUsphere
        source_type: copernicus_recent
        rss_url: https://egusphere.copernicus.org/
        copernicus_recent_url: https://egusphere.copernicus.org/
        copernicus_recent_max_entries: 100
        abstract_tag: summary
        slack_channel_id: C01234567
        include_keywords:
          - seismology
          - earthquake
          - seismic
          - volcan
          - geodesy
          - tomography
        metadata_fallback:
          - openalex
          - crossref
        min_abstract_length: 500
        exclude_title_patterns:
          - Editorial
          - Erratum
          - Corrigendum
          - Correction
          - Comment on
          - Reply to the comment
          - Reply to comment
          - Book review
          - Obituary
        prefilter:
          method: llm
          provider: github
          target_scope: >
            EGUsphere preprintのうち、地震学者に有用な固体地球科学・地球物理学論文を対象とする。
            地震、断層、震源過程、地震波、地震活動、スロー地震、微動、強震動、
            火山性地震、火山体構造、測地、地殻変動、重力、地震波トモグラフィ、
            地殻・リソスフェア・マントル構造、沈み込み帯、テクトニクス、津波を relevant とする。
            純粋な気候、水文、海洋、大気、氷床、地球化学、堆積学のみの論文は対象外。
            判断が難しい場合は relevant ではなく uncertain とする。


      - title: Science
        full_title: Science
        issn: 0036-8075
        eissn: 1095-9203
        rss_url: https://www.science.org/action/showFeed?feed=rss&jc=science&type=etoc
        link_tag: link
        abstract_tag: summary
        slack_channel_id: C01234568
        abstract_fallback: []
        metadata_fallback:
          - openalex
          - crossref
        min_abstract_length: 500
        prefilter_uncertain: skip
        include_keywords:
          - earthquake
          - seism
          - seismic
          - seismology
          - seismicity
          - fault
          - rupture
          - slow slip
          - tremor
          - subduction
          - tectonic
          - geodynamic
          - geodynamics
          - deformation
          - crustal deformation
          - coseismic
          - postseismic
          - interseismic
          - crust
          - crustal
          - lithosphere
          - mantle
          - core
          - tomography
          - anisotropy
          - attenuation
          - scattering
          - geodesy
          - geodetic
          - gnss
          - gps
          - insar
          - gravity
          - gravimetry
          - geoid
          - volcano
          - volcanic
          - magma
          - caldera
          - tsunami
          - landslide
          - mass redistribution
          - loading
          - surface displacement
          - ground deformation
          - das
          - distributed acoustic sensing
          - fiber optic
        exclude_title_patterns:
          - Editorial
          - Corrigendum
          - Correction
          - Technical Comment
          - Response to Technical Comment
          - Retraction
          - Expression of concern
          - Perspective
          - Policy Forum
          - News
          - Careers
          - Book Review
          - This Week in Science
        prefilter:
          method: llm
          provider: github
          target_scope: >
            Science本誌の全分野論文のうち、地震学・測地学・火山学・テクトニクス・
            固体地球物理学の利用者に明確に有用なものだけを対象とする。

            relevant とするもの：
            地震、断層、震源過程、地震活動、地震波、地震波トモグラフィ、異方性、減衰、散乱、
            スロー地震、微動、地殻・リソスフェア・マントル・核構造、沈み込み帯、プレート運動、
            テクトニクス、地球内部ダイナミクス、地殻変動、GNSS、InSAR、SAR、重力、ジオイド、
            地震時・地震間・余効変動、火山、マグマ、火山性地震、火山性微動、火山性地殻変動、
            津波、地すべり・斜面災害、DAS、地球物理観測手法、地表荷重、質量再分配、荷重応答に関する論文。

            一見すると気候、水文、雪氷、海洋、大気、地形、地球化学、惑星科学、機械学習、
            リモートセンシングに見える論文でも、地震・断層・火山・地殻変動・測地観測・重力観測・
            地表変形・荷重応答・地震波観測・地球内部構造との接点がAbstract内に明確に書かれていれば relevant とする。

            irrelevant とするもの：
            生命科学、医学、材料、化学、物理一般、工学一般、社会科学、気候変動、海洋循環、水文、
            雪氷、古気候、地球化学、生物地球化学、生態、環境科学、惑星大気、惑星表層、天文学、宇宙物理、
            政策・リスク評価が主題で、地震学・測地学・火山学・テクトニクス・固体地球物理学との
            明確な接点がAbstract内に見えないもの。

            Science掲載論文であっても、上記の接点がAbstract内に明示されていない場合は irrelevant とする。
            「Science本誌に掲載された重要論文である」「地球科学一般である」「リモートセンシングを使っている」
            という理由だけでは relevant にしない。
            判断が難しい場合でも、固体地球物理学的な接点がAbstract内に明示されていなければ irrelevant とする。

