name: Post new papers to Slack

on:
  schedule:
    # UTC: 21:20, 01:20, 05:20, 09:20  (~ JST 06:20, 10:20, 14:20, 18:20)
    - cron: '20 21,1,5,9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: post-new-papers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # For feeds that block cloud IPs, switch to: runs-on: self-hosted
    env:
      TZ: Asia/Tokyo
      DRY_RUN: "false"
      DRY_RUN_SUMMARIZE: "true"
      DRY_RUN_CLASSIFY: "true"
      POSTED_FILE: "posted_entries.txt"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate secrets.yaml
        run: |
          cat <<'YAML' > secrets.yaml
          openai_api_key: "${{ secrets.OPENAI_API_KEY }}"
          openai_model: "gpt-4o-mini"

          classifier_provider: "github"
          classifier_model: "openai/gpt-4.1-nano"
          github_token: "${{ github.token }}"

          slack_api_tokens:
            default: "${{ secrets.SLACK_API_TOKEN }}"
          YAML
          # Optional: add SLACK_API_TOKEN_OTHER, SPRINGER_API_KEY to secrets
          # and extend the YAML above for multi-workspace / Springer API usage.

      - name: Run bot
        run: python main.py

      - name: Commit posted entries
        run: |
          POSTED_PATH="${POSTED_FILE:-posted_entries.txt}"

          if git status --porcelain -- "$POSTED_PATH" | grep -q .; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add "$POSTED_PATH"
            git commit -m "chore: update $POSTED_PATH [skip ci]"
            git push
          fi
