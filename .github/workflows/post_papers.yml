name: Post new papers to Slack

on:
  schedule:
    # UTC 21:20, 01:20, 05:20, 09:20 = JST 06:20, 10:20, 14:20, 18:20
    - cron: "20 21,1,5,9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check papers without calling OpenAI, posting, or saving state
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  models: read

concurrency:
  group: post-new-papers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      DRY_RUN_SUMMARIZE: "false"
      DRY_RUN_CLASSIFY: "false"
      POSTED_FILE: posted_entries.txt
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create runtime secrets file
        run: |
          cat <<'YAML' > secrets.yaml
          openai_api_key: "${{ secrets.OPENAI_API_KEY }}"
          openai_summary_model: "gpt-5.6-luna"
          openai_summary_reasoning_effort: "low"
          openai_prefilter_model: "gpt-5.6-luna"

          classifier_provider: "openai"
          classifier_model: "openai/gpt-4.1-nano"
          github_token: "${{ github.token }}"

          slack_api_tokens:
            default: "${{ secrets.SLACK_API_TOKEN }}"

          springer_api_key: "${{ secrets.SPRINGER_API_KEY }}"
          YAML

      - name: Run tests
        run: python -m pytest

      - name: Run bot
        run: python main.py

      - name: Save duplicate-prevention state
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true) }}
        run: |
          if git status --porcelain -- posted_entries.txt | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add posted_entries.txt
            git commit -m "chore: update posted entries [skip ci]"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
